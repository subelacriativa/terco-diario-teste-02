<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santo Terço do Dia</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="card-oracao">
    <div class="icone-top">🕊️</div>

    <div id="data-completa" class="data-completa">Carregando data...</div>
    
    <h1 id="titulo-misterio" class="titulo">Santo Terço</h1>
    <p id="subtitulo-misterio" class="subtitulo">Acompanhe a oração com fé.</p>

    <div class="bloco-secao">
        <h3>🙏 Evangelho do Dia</h3>
        <p id="evangelho-dia" class="texto-conteudo" style="font-style: italic;"></p>
    </div>

    <div class="bloco-secao">
        <h3>📿 Mistérios de Hoje</h3>
        <ul id="lista-misterios" class="lista-misterios"></ul>
    </div>

    <div class="bloco-secao">
        <h3>📖 Intenção do Dia</h3>
        <p id="intencao-dia" class="texto-conteudo"></p>
    </div>

    <div class="bloco-secao">
        <h3>❤️ Frase de um Santo</h3>
        <p id="frase-santo" class="texto-conteudo" style="font-style: italic;"></p>
    </div>

    <hr class="divisor">

    <div style="text-align: left; margin-bottom: 5px;">
        <strong style="font-size: 0.9rem; color: var(--primary);">▶ Ouça o Santo Terço</strong>
    </div>
    <audio id="player-audio" controls controlsList="nodownload" preload="metadata">
        <source id="source-audio" src="" type="audio/mpeg">
        Seu navegador não suporta o áudio.
    </audio>

    <hr class="divisor">

    <div class="mensagem-final">
        <p>✨ <strong>Oração Final:</strong> <span id="oracao-final"></span></p><br>
        <p>🌹 <strong>Ave-Maria Final:</strong> <span id="ave-maria-final"></span></p>
    </div>
</div>

<script src="js/dados.js"></script>

<script>
    const agora = new Date();
    const diaSemanaIndex = agora.getDay();
    const configDia = dadosMisterios[diaSemanaIndex];

    // Data formatada
    const opcoesData = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
    let dataFormatada = agora.toLocaleDateString('pt-BR', opcoesData);
    dataFormatada = dataFormatada.charAt(0).toUpperCase() + dataFormatada.slice(1);
    document.getElementById('data-completa').innerText = `📅 ${dataFormatada}`;

    // Aplica o tema visual do dia
    if (configDia.classeTema) {
        document.body.classList.add(configDia.classeTema);
    }

    // Preenche títulos
    document.getElementById('titulo-misterio').innerText = configDia.titulo;
    document.getElementById('subtitulo-misterio').innerText = configDia.subtitulo;

    // Preenche a lista dos 5 mistérios
    const listaUl = document.getElementById('lista-misterios');
    configDia.misterios.forEach(misterio => {
        const li = document.createElement('li');
        li.innerText = misterio;
        listaUl.appendChild(li);
    });

    // Preenche Evangelho, Intenção e Frase
    document.getElementById('evangelho-dia').innerText = configDia.evangelho;
    document.getElementById('intencao-dia').innerText = configDia.intencao;
    document.getElementById('frase-santo').innerText = configDia.frase;

    // Preenche oração e Ave-Maria finais
    document.getElementById('oracao-final').innerText = configDia.oracaoFinal;
    document.getElementById('ave-maria-final').innerText = configDia.aveMariaFinal;

    // Configura o player de áudio
    const player = document.getElementById('player-audio');
    const source = document.getElementById('source-audio');
    source.src = configDia.audio;
    player.load();
</script>

</body>
</html>
